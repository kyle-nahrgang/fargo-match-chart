name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: |
          # Extract repository name from owner/repo format
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          # Check if this is a user/organization page (repo name matches owner name)
          OWNER_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f1)
          if [ "$REPO_NAME" = "${OWNER_NAME}.github.io" ]; then
            # User/organization page - use root base path
            BASE_PATH="/"
          else
            # Project page - use repository name as base path
            BASE_PATH="/$REPO_NAME/"
          fi
          echo "Building with VITE_BASE_PATH=$BASE_PATH"
          VITE_BASE_PATH="$BASE_PATH" npm run build

      - name: Create .nojekyll file
        run: touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
